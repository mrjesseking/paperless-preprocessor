name: Publish image

# Publishes only for trusted refs: pushes to main, version tags (v*), or a manual
# run started from main or a version tag. Never triggered by pull requests.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/mrjesseking/paperless-preprocessor

jobs:
  test:
    name: Offline regression tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests

  publish:
    name: Build, smoke test, push multi-arch image
    needs: test
    # Manual runs are allowed only from main or a version tag.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Smoke-test amd64 build before publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: paperless-preprocessor:smoke
      - run: |
          docker run --rm --entrypoint python \
            -v "$PWD/scripts:/smoke:ro" \
            paperless-preprocessor:smoke /smoke/smoke_test.py

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha,format=short,prefix=sha-,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push linux/amd64 + linux/arm64
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify manifest lists both architectures
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          out="$(docker buildx imagetools inspect "$IMAGE@$DIGEST")"
          echo "$out"
          echo "$out" | grep -q 'Platform: *linux/amd64'
          echo "$out" | grep -q 'Platform: *linux/arm64'
          {
            echo "### Published"
            echo "- Digest: \`$DIGEST\`"
            echo "- Tags: \`$(echo "${{ steps.meta.outputs.tags }}" | tr '\n' ' ')\`"
          } >> "$GITHUB_STEP_SUMMARY"
